repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: pixi run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: pixi run ruff format
        language: system
        types: [python]

      - id: ty
        name: ty type check
        entry: pixi run ty check src
        language: system
        pass_filenames: false
        always_run: true