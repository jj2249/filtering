[project]
name = "ssms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jj249", email = "joseph123johnson@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[project.scripts]
ssms = "ssms:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.32.3",
    "nbstripout>=0.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vglm"]
