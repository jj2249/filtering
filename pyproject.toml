[project]
authors = [{name = "jj249", email = "joseph123johnson@outlook.com"}]
dependencies = []
name = "filtering"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
filtering = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.dev.dependencies]
ruff = "*"
ty = "*"
pre-commit = ">=4.6.2,<5"
nbstripout = ">=0.9.1,<0.10"

[tool.pixi.feature.dev.tasks]
nbstripout-install = "nbstripout --install --attributes .gitattributes"

[tool.pixi.feature.notebook.dependencies]
jupyter = "*"
matplotlib = "*"

[tool.pixi.feature.notebook.tasks]
notebook = "jupyter lab notebooks"

[tool.pixi.dependencies]
jax = ">=0.10.2,<0.11"

[tool.pixi.environments]
prod = { solve-group = "runtime" }
dev = { features = ["dev"], solve-group = "runtime" }
notebook = { features = ["dev", "notebook"], solve-group = "runtime" }

[tool.ruff]
# Match the Python version used by your project.
target-version = "py314"
line-length = 88

# Add to Ruff's default exclusions.
extend-exclude = [".pixi"]

[tool.ruff.lint]
# Common, useful checks:
# E/F: basic errors and undefined names
# I: import sorting
# UP: outdated Python syntax
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
# Use double quotes and standard Ruff formatting.
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"
root = ["src"]

[tool.ty.src]
# Type-check the application source.
include = ["src"]
exclude = [".pixi"]
